#
### eos_bootloader Module — aarch64 adaptation
#
# ARM changes:
# - grub: installs from the /usr/share/packages cache (grub + os-prober,
#   both cached by run_before_squashfs.sh); no eos-dracut on ARM (mkinitcpio)
# - systemd-boot: no extra packages needed (systemd ships bootctl)
# - refind: removed (not available in the ALARM repos)
#

gsName: packagechooser_packagechooserq

offline: true

packageLocation: /usr/share/packages

bootloader:
    - name: grub
      packages: [ grub, os-prober ]
    - name: systemd-boot
      packages: []
    - name: none
      packages: []
