#
# aarch64: regenerate the initramfs in the target with mkinitcpio
# (upstream EOS x86 uses dracut instead — see eos-dracut)
---

# Kernel to generate the initramfs for: "all" runs mkinitcpio -P,
# regenerating every preset in /etc/mkinitcpio.d/
kernel: all
