#
# shellprocess_fixes_offline.conf — aarch64 adaptation
#
# ARM changes vs upstream:
# - write a proper target mkinitcpio preset (the live ISO ships an
#   archiso-only preset for linux-eos-arm)
# - strip the archiso mkinitcpio drop-ins so the target initramfs is a
#   real system initramfs (regenerated afterwards by initcpiocfg/initcpio)
---

dontChroot: true

verbose: true

script:
 - "cp /etc/calamares/files/endeavouros-wallpaper.png ${ROOT}/usr/share/endeavouros/backgrounds/endeavouros-wallpaper.png"
 - "cp -a /etc/calamares/scripts ${ROOT}/etc/calamares/"
 - "cp /etc/calamares/files/linux-eos-arm-preset ${ROOT}/etc/mkinitcpio.d/linux-eos-arm.preset"
 - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
 - "rm -f ${ROOT}/etc/mkinitcpio.conf"

i18n:
 name: "Apply minor fixes"
